<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CekDulu · Latihan memeriksa pesan sebelum klik</title>
  <meta name="description" content="Latihan interaktif mengenali pesan penipuan. Semua contoh fiktif, tanpa login, tanpa data yang dikirim.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">CekDulu</a>

  <main class="page">
    <noscript><p>Aktifkan JavaScript untuk memakai CekDulu.</p></noscript>
    <div id="coach"></div>
    <div id="units"></div>

    <section class="recap" aria-labelledby="recap-title">
      <h2 id="recap-title">5 Pertanyaan Sebelum Klik</h2>

    <button type="button" class="link-btn" id="reset">Hapus progres</button>
  </footer>
